<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Wise Pharmacy - Billing</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2E7D32">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏥 Health Wise Pharmacy</h1>
      <p>Billing & Sales Tracker</p>
    </header>

    <div class="card">
      <h2>Add New Sale</h2>
      <input type="text" id="customerName" placeholder="Customer Name">
      <input type="text" id="medicine" placeholder="Medicine / Item">
      <input type="number" id="totalBill" placeholder="Total Bill Rs">
      <input type="number" id="paidAmount" placeholder="Paid Amount Rs">
      <button onclick="addSale()">+ Add Sale</button>
    </div>

    <div class="card dashboard">
      <h2>Dashboard</h2>
      <p><b>Total Sales:</b> Rs <span id="totalSales">0</span></p>
      <p><b>Total Collected:</b> Rs <span id="totalCollected">0</span></p>
      <p><b>Total Due:</b> Rs <span id="totalDue">0</span></p>
    </div>

    <div class="card">
      <h2>Sales History</h2>
      <div id="salesList"></div>
      <button class="export-btn" onclick="exportData()">📥 Export Backup</button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    // This makes the "Install App" popup appear
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
